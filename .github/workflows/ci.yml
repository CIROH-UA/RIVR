name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [development, main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create CI stub files
        run: |
          cp lib/firebase_options.ci.dart lib/firebase_options.dart
          cp lib/services/0_config/shared/config.template.dart lib/services/0_config/shared/config.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # CI tracks a newer Flutter stable than local dev, which surfaces
        # forward-looking deprecation lints (info level). Keep warnings and
        # errors fatal, but don't fail the build on infos.
        run: flutter analyze --no-fatal-infos

      # Everything under test/ EXCEPT integration_test, which has ~27
      # long-standing pre-existing failures and needs a device.
      #
      # Enumerated by exclusion rather than by an allow-list, because the
      # allow-list silently dropped a whole directory. `test/docs/` was added
      # in ADR 0011 Phase 9 and ran nowhere: the guard written so that
      # CLAUDE.md's path-rot "no longer needs a human" was itself enforced
      # only by a human remembering to run bare `flutter test`. Found by the
      # Phase 9 review.
      #
      # This is the SECOND time CI's coverage was narrower than everyone
      # believed — see the note below about the functions suite. An allow-list
      # of directories is a promise that someone will remember to update it.
      - name: Test (unit & widget only)
        run: |
          dirs=$(find test -maxdepth 1 -mindepth 1 -type d \
                   ! -name integration_test | sort | tr '\n' ' ')
          echo "Running: $dirs"
          test -n "$dirs" || { echo "No test directories found"; exit 1; }
          flutter test $dirs

      # The Cloud Functions suite was never run by CI, which made a claim in
      # several files false: comments in flow-classification.ts, CLAUDE.md and
      # ADR 0011 all said a cross-language rename "fails the build". Nothing
      # ran them, so nothing failed. Those drift guards read the Dart source off
      # disk and are the only thing stopping the app and the server disagreeing
      # about flood categories, freshness skews and stored field names — they
      # are worth a minute of CI.
      - name: Set up Node for the Cloud Functions suite
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      - name: Lint Cloud Functions
        run: npm --prefix functions run lint

      - name: Test Cloud Functions (includes the cross-language drift guards)
        run: npm --prefix functions test
